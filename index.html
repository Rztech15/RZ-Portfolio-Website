<style>
:root{--obs:#0D0D0F;--char:#1F1F23;--gra:#292B30;--steel:#41454B;--ti:#AEB6BD;--sw:#E1E5E9;--tx:#F8FAFC;--tx2:#A1A1AA;--mu:#71717A;--metal:linear-gradient(135deg,#E1E5E9,#AEB6BD 55%,#8A9299);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--obs);color:var(--tx);font:400 1rem/1.7 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;line-height:1.15}
a{color:inherit}
:focus-visible{outline:2px solid var(--sw);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 5%}
section{padding:96px 0}
section:nth-of-type(even){background:var(--char)}
h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-bottom:.6rem}
.lead{color:var(--tx2);max-width:60ch;margin-bottom:2.5rem}
.skip{position:absolute;left:-999px;top:8px;background:var(--sw);color:#000;padding:8px 14px;border-radius:6px;z-index:300}.skip:focus{left:8px}
/* nav */
header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,13,15,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--steel);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 1.25rem Manrope;text-decoration:none;letter-spacing:.03em;white-space:nowrap;display:inline-block;perspective:600px}.logo span{display:inline-block;background:linear-gradient(110deg,transparent 42%,#fff 50%,transparent 58%) 0 0/250% 100% no-repeat,var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;filter:drop-shadow(0 1px 0 #555a61) drop-shadow(0 2px 0 #41454B) drop-shadow(0 4px 6px rgba(0,0,0,.6));animation:shine 4.5s ease-in-out infinite}@keyframes shine{0%{background-position:150% 0,0 0}60%,100%{background-position:-50% 0,0 0}}@media(prefers-reduced-motion:reduce){.logo span{animation:none}}
.logo b{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
nav ul{display:flex;gap:1.6rem;list-style:none}
nav a{color:var(--tx2);text-decoration:none;font-size:.9rem;font-weight:500;transition:color .2s}nav a:hover{color:var(--tx)}
.burger{display:none;background:none;border:1px solid var(--steel);color:var(--tx);border-radius:8px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
@media(max-width:820px){.burger{display:block}nav{position:absolute;top:100%;left:0;right:0;background:var(--char);border-bottom:1px solid var(--steel);display:none}nav.open{display:block}nav ul{flex-direction:column;gap:0;padding:.5rem 5%}nav a{display:block;padding:14px 0;border-bottom:1px solid var(--gra)}}
